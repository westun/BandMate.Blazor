# ASP.NET Core

trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'

steps:
# 1. Install .NET 10
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.x'

# 2. Build and Package (This creates the missing .zip)
- task: DotNetCoreCLI@2
  displayName: 'Publish and Zip App'
  inputs:
    command: 'publish'
    publishWebProjects: true
    # Arguments to zip the output and place it in the Artifact Staging Directory
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# 3. Deploy to Azure
- task: AzureRmWebAppDeployment@5
  displayName: 'Deploy to Azure'
  inputs:
    ConnectionType: 'PublishProfile'
    PublishProfilePath: '$(System.DefaultWorkingDirectory)/**/*.pubxml'
     # Reference the secret variable you created in Azure DevOps
    PublishProfilePassword: '$(publishPassword)' 
    # Update this to match where the publish task put the file
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/BandMateBlazorApp.zip'

